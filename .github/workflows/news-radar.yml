# News Radar — collects every channel, renders and delivers. No local machine is
# involved: all enabled channels need only the network (collector.cloudChannels).
#
# Delivery needs three repo secrets, all set:
#   MAIL_USERNAME  — the Gmail address
#   MAIL_PASSWORD  — a Gmail *app password*, stripped of the non-breaking spaces
#                    Google's UI puts between the four groups (16 chars, not 19)
#   MAIL_TO        — where the digest goes
# The mail step needs both USERNAME and PASSWORD present or it skips, so running
# this workflow is safe even if a secret is later removed.
#
# Actions are pinned to Node 24-era majors; anything still on Node 20 emits a
# deprecation warning on every run and will eventually stop working.

name: news-radar

on:
  workflow_dispatch:
    inputs:
      force_digest:
        description: "Render a digest even if nothing is new (tests the mail path)"
        type: boolean
        default: false
      # Scheduled runs send at most one digest a day; a manual run always may.
      trigger:
        description: "Who started this run — leave as manual"
        type: string
        default: manual
  # One email a day, at 12:00 Amsterdam time. GitHub starts scheduled runs hours
  # late (a 06:37 UTC cron landed anywhere from 11:08 to 16:03 UTC), so one cron at
  # noon would mean an afternoon email. Instead there are many ticks through the
  # morning and the `gate` job below picks one: a tick that lands between 10:00 and
  # 12:00 waits until 12:00 and delivers; a tick after 12:00 delivers at once
  # unless today's run already happened; every other tick ends in seconds. The
  # range covers 12:00 in both CET (11:00 UTC) and CEST (10:00 UTC).
  schedule:
    - cron: "17,47 5-12 * * *"

permissions:
  contents: write
  pages: write
  id-token: write

# Serialise Pages deployments so concurrent runs cannot collide.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  # Scheduled runs only; a manual run always goes straight through.
  gate:
    runs-on: ubuntu-latest
    outputs:
      go: ${{ steps.decide.outputs.go }}
    steps:
      # The branch tip, not the commit the run was queued at: a tick that waited
      # behind the noon run must see that run's render, or it would mail again.
      - uses: actions/checkout@v7
        if: github.event_name == 'schedule'
        with: { ref: "${{ github.ref_name }}", fetch-depth: 50 }
      - id: decide
        env:
          TZ: Europe/Amsterdam
        run: |
          if [ "${{ github.event_name }}" != "schedule" ]; then echo "go=true" >> "$GITHUB_OUTPUT"; exit 0; fi
          today=$(date +%F); now=$(date +%H%M)
          # Today's run already happened: a digest went out today, or a render was
          # committed today at or after 12:00 (a quiet day sends nothing but still renders).
          sent=$(node -e 'try { const s = require("./data/digest-state.json"); console.log(new Date(s.lastDigestAt).toLocaleDateString("en-CA", { timeZone: "Europe/Amsterdam" })) } catch {}')
          rendered=$(git log -1 --format=%cd --date=format-local:'%F %H%M' -- data/items.json)
          if [ "$sent" = "$today" ] || { [ "${rendered% *}" = "$today" ] && [ "${rendered#* }" -ge 1200 ]; }; then
            echo "today's lunchtime run already happened"; echo "go=false" >> "$GITHUB_OUTPUT"; exit 0
          fi
          if [ "$now" -lt 1000 ]; then echo "too early ($now)"; echo "go=false" >> "$GITHUB_OUTPUT"; exit 0; fi
          if [ "$now" -lt 1200 ]; then
            wait=$(( $(date -d "$today 12:00" +%s) - $(date +%s) ))
            echo "waiting ${wait}s until 12:00"; sleep "$wait"
          fi
          echo "go=true" >> "$GITHUB_OUTPUT"

  deliver:
    needs: gate
    if: needs.gate.outputs.go == 'true'
    runs-on: ubuntu-latest
    # Secrets are not readable from a step's `if:`, so they are lifted to job env
    # to be testable there. Both must be present: with a username but no app
    # password the mail step would attempt SMTP and fail the run, where skipping
    # is the correct behaviour until delivery is fully configured.
    env:
      MAIL_USERNAME: ${{ secrets.MAIL_USERNAME }}
      MAIL_PASSWORD: ${{ secrets.MAIL_PASSWORD }}
    steps:
      # Branch tip, for the same reason as in `gate`: the state files must be current.
      - uses: actions/checkout@v7
        with: { ref: "${{ github.ref_name }}" }
      - uses: actions/setup-node@v7
        with: { node-version: "22" }
      - run: npm ci || npm install
      - run: npm run build

      # If SMTP ever returns 535 BadCredentials again, the cause is almost always
      # the stored password carrying Google's display separators — which are
      # non-breaking spaces, so [[:space:]] will not find them. Compare
      # ${#MAIL_PASSWORD} against the alphanumeric-only count (should both be 16):
      #   printf '%s' "$MAIL_PASSWORD" | LC_ALL=C tr -cd 'a-zA-Z0-9' | wc -c

      # Exa's hosted MCP endpoint needs no key; mcporter is the same client the Mac
      # uses, pinned so a release cannot change the output format under the parser.
      - name: Set up exa client
        run: |
          npm install -g mcporter@0.13.0
          mkdir -p ~/.mcporter
          echo '{"mcpServers":{"exa":{"baseUrl":"https://mcp.exa.ai/mcp"}}}' > ~/.mcporter/mcporter.json

      # Best-effort like every collector: a failure leaves the previous
      # reach-cloud.json in place to age, and the freshness gate and the BROKEN
      # heartbeat take it from there. It must not stop the render or the email.
      - name: Collect (exa, github, rss, reddit, news, marktplaats)
        env:
          REACH_SIDE: cloud
          GH_TOKEN: ${{ github.token }}
        run: node scripts/reach-collect.mjs || echo "::warning::cloud collection produced nothing (exit $?)"

      - name: Render digest and dashboard
        id: render
        env:
          NEWS_RADAR_DIGEST_FORCE: ${{ inputs.force_digest }}
          # manual from a dispatch; inputs are empty on a schedule run.
          NEWS_RADAR_TRIGGER: ${{ inputs.trigger || github.event_name }}
          NEWS_RADAR_DASHBOARD_URL: ${{ vars.NEWS_RADAR_DASHBOARD_URL }}
          # Dutch headline translation; absent or spent, titles stay Dutch.
          DEEPL_API_KEY: ${{ secrets.DEEPL_API_KEY }}
        run: npm start

      # Fires for both a digest and the 3-day heartbeat — the subject says which.
      - name: Email digest
        if: steps.render.outputs.send == 'true' && env.MAIL_USERNAME != '' && env.MAIL_PASSWORD != ''
        # v17, not v3: v3 runs on Node 20, which GitHub has deprecated. Every input
        # used here carries the same name in v17, so the bump is a drop-in.
        uses: dawidd6/action-send-mail@v17
        with:
          server_address: smtp.gmail.com
          server_port: 465
          secure: true
          username: ${{ secrets.MAIL_USERNAME }}
          password: ${{ secrets.MAIL_PASSWORD }}
          from: News Radar <${{ secrets.MAIL_USERNAME }}>
          to: ${{ secrets.MAIL_TO }}
          subject: ${{ steps.render.outputs.subject }}
          html_body: file://digest.html
          convert_markdown: false

      # seen-history must persist or every run re-mails the same items.
      - name: Commit render state
        run: |
          git config user.name "news-radar-bot"
          git config user.email "bot@users.noreply.github.com"
          git add data/reach-cloud.json data/seen-history.json data/digest-state.json data/items.json data/index.html
          # Only exists once DeepL has translated something.
          [ -f data/translations.json ] && git add data/translations.json
          git diff --cached --quiet && echo "no changes" && exit 0
          git commit -m "news-radar: render $(date -u +%FT%TZ)"
          git pull --rebase --autostash origin ${{ github.ref_name }}
          git push

      # Only the dashboard is published. data/ also holds the raw collection and the
      # state files: already public in the repo, but there is no reason to serve them
      # from the site as well.
      - name: Stage the site
        run: mkdir -p _site && cp data/index.html _site/index.html

      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    needs: deliver
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # Pages intermittently answers "Deployment failed, try again later"; the first
      # attempt tolerates it so a transient failure does not fail the run.
      - id: deployment
        uses: actions/deploy-pages@v5
        continue-on-error: true
      - name: Retry deploy on transient failure
        if: steps.deployment.outcome == 'failure'
        uses: actions/deploy-pages@v5
