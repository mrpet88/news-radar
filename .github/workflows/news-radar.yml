# News Radar — delivery half of the pipeline.
#
# It deliberately does NOT collect. Collection needs this Mac's Chrome session and
# mcporter config, so a runner cannot do it — Actions only renders and delivers what
# scripts/run-local.sh last pushed. That is what keeps the email agent-reach-backed.
#
# Before enabling the schedule, add these repo secrets (same ones job-radar uses):
#   MAIL_USERNAME  — the Gmail address
#   MAIL_PASSWORD  — a Gmail *app password*, not the account password
#   MAIL_TO        — where the digest goes
# Without MAIL_USERNAME the mail step skips cleanly, so a dry run is safe.

name: news-radar

on:
  workflow_dispatch:
    inputs:
      force_digest:
        description: "Render a digest even if nothing is new (tests the mail path)"
        type: boolean
        default: false
  # 06:30 UTC ≈ 08:30 CEST — comfortably after the 06:45 local collection has run
  # and pushed. If the Mac was asleep, the 24h freshness gate blocks the email and
  # only the dashboard updates.
  schedule:
    - cron: "30 6 * * *"

permissions:
  contents: write

jobs:
  deliver:
    runs-on: ubuntu-latest
    # Secrets are not readable from a step's `if:`, so they are lifted to job env
    # to be testable there. Both must be present: with a username but no app
    # password the mail step would attempt SMTP and fail the run, where skipping
    # is the correct behaviour until delivery is fully configured.
    env:
      MAIL_USERNAME: ${{ secrets.MAIL_USERNAME }}
      MAIL_PASSWORD: ${{ secrets.MAIL_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "22" }
      - run: npm ci || npm install
      - run: npm run build

      # TEMPORARY diagnostic. Prints only lengths and whitespace flags, never the
      # values — enough to tell a 16-character app password from one carrying
      # Google's display spaces, or from an account password pasted by mistake.
      - name: Inspect mail secret shape
        run: |
          printf 'MAIL_USERNAME  length=%s\n' "${#MAIL_USERNAME}"
          printf 'MAIL_PASSWORD  length=%s\n' "${#MAIL_PASSWORD}"
          printf 'MAIL_TO        length=%s\n' "${#MAIL_TO}"
          case "$MAIL_USERNAME" in *[[:space:]]*) echo "!! MAIL_USERNAME contains whitespace";; esac
          case "$MAIL_PASSWORD" in *[[:space:]]*) echo "!! MAIL_PASSWORD contains whitespace";; esac
          case "$MAIL_TO" in *[[:space:]]*) echo "!! MAIL_TO contains whitespace";; esac
          case "$MAIL_USERNAME" in *@*) echo "MAIL_USERNAME looks like an address";; *) echo "!! MAIL_USERNAME is not an address";; esac
          echo "(expected: username ~19, password 16, to ~19)"
        env:
          MAIL_TO: ${{ secrets.MAIL_TO }}

      - name: Render digest and dashboard
        id: render
        env:
          NEWS_RADAR_DIGEST_FORCE: ${{ inputs.force_digest }}
          NEWS_RADAR_DASHBOARD_URL: ${{ vars.NEWS_RADAR_DASHBOARD_URL }}
        run: npm start

      # Fires for both a digest and the 3-day heartbeat — the subject says which.
      - name: Email digest
        if: steps.render.outputs.send == 'true' && env.MAIL_USERNAME != '' && env.MAIL_PASSWORD != ''
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          secure: true
          username: ${{ secrets.MAIL_USERNAME }}
          password: ${{ secrets.MAIL_PASSWORD }}
          from: News Radar <${{ secrets.MAIL_USERNAME }}>
          to: ${{ secrets.MAIL_TO }}
          subject: ${{ steps.render.outputs.subject }}
          html_body: file://digest.html
          convert_markdown: false

      # seen-history must persist or every run re-mails the same items. The Mac
      # writes reach-raw.json and this job writes the render state, so rebase
      # rather than assume this runner is the only writer.
      - name: Commit render state
        run: |
          git config user.name "news-radar-bot"
          git config user.email "bot@users.noreply.github.com"
          git add data/seen-history.json data/digest-state.json data/items.json data/index.html
          git diff --cached --quiet && echo "no changes" && exit 0
          git commit -m "news-radar: render $(date -u +%FT%TZ)"
          git pull --rebase --autostash origin ${{ github.ref_name }}
          git push

      - name: Upload dashboard artifact
        uses: actions/upload-artifact@v4
        with:
          name: news-radar-dashboard
          path: data/index.html
          retention-days: 7

# ── Hosting the dashboard ────────────────────────────────────────────────────
# This repo is private, and GitHub Pages on a private repo needs a paid plan, so
# there is no Pages deploy above — the dashboard is `data/index.html`, written on
# every local run. To host it, flip the repo to Public (Settings → General →
# Danger Zone), enable Pages (Settings → Pages → Source: GitHub Actions), then add
# `pages: write` and `id-token: write` to permissions above and append:
#
#   - uses: actions/upload-pages-artifact@v3
#     with: { path: data }
#   deploy:
#     needs: deliver
#     runs-on: ubuntu-latest
#     environment: { name: github-pages }
#     steps:
#       - uses: actions/deploy-pages@v4
#
# Then set the NEWS_RADAR_DASHBOARD_URL repo variable so the email links to it.
