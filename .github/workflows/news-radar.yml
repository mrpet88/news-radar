# News Radar — delivery half of the pipeline.
#
# It deliberately does NOT collect. Collection needs this Mac's Chrome session and
# mcporter config, so a runner cannot do it — Actions only renders and delivers what
# scripts/run-local.sh last pushed. That is what keeps the email agent-reach-backed.
#
# Delivery needs three repo secrets, all set:
#   MAIL_USERNAME  — the Gmail address
#   MAIL_PASSWORD  — a Gmail *app password*, stripped of the non-breaking spaces
#                    Google's UI puts between the four groups (16 chars, not 19)
#   MAIL_TO        — where the digest goes
# The mail step needs both USERNAME and PASSWORD present or it skips, so running
# this workflow is safe even if a secret is later removed.
#
# Actions are pinned to Node 24-era majors; anything still on Node 20 emits a
# deprecation warning on every run and will eventually stop working.

name: news-radar

on:
  workflow_dispatch:
    inputs:
      force_digest:
        description: "Render a digest even if nothing is new (tests the mail path)"
        type: boolean
        default: false
  # 06:30 UTC ≈ 08:30 CEST — comfortably after the 06:45 local collection has run
  # and pushed. If the Mac was asleep, the 24h freshness gate blocks the email and
  # only the dashboard updates.
  schedule:
    - cron: "30 6 * * *"

permissions:
  contents: write
  pages: write
  id-token: write

# Serialise Pages deployments so concurrent runs cannot collide.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deliver:
    runs-on: ubuntu-latest
    # Secrets are not readable from a step's `if:`, so they are lifted to job env
    # to be testable there. Both must be present: with a username but no app
    # password the mail step would attempt SMTP and fail the run, where skipping
    # is the correct behaviour until delivery is fully configured.
    env:
      MAIL_USERNAME: ${{ secrets.MAIL_USERNAME }}
      MAIL_PASSWORD: ${{ secrets.MAIL_PASSWORD }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version: "22" }
      - run: npm ci || npm install
      - run: npm run build

      # If SMTP ever returns 535 BadCredentials again, the cause is almost always
      # the stored password carrying Google's display separators — which are
      # non-breaking spaces, so [[:space:]] will not find them. Compare
      # ${#MAIL_PASSWORD} against the alphanumeric-only count (should both be 16):
      #   printf '%s' "$MAIL_PASSWORD" | LC_ALL=C tr -cd 'a-zA-Z0-9' | wc -c

      - name: Render digest and dashboard
        id: render
        env:
          NEWS_RADAR_DIGEST_FORCE: ${{ inputs.force_digest }}
          NEWS_RADAR_DASHBOARD_URL: ${{ vars.NEWS_RADAR_DASHBOARD_URL }}
        run: npm start

      # Fires for both a digest and the 3-day heartbeat — the subject says which.
      - name: Email digest
        if: steps.render.outputs.send == 'true' && env.MAIL_USERNAME != '' && env.MAIL_PASSWORD != ''
        # v17, not v3: v3 runs on Node 20, which GitHub has deprecated. Every input
        # used here carries the same name in v17, so the bump is a drop-in.
        uses: dawidd6/action-send-mail@v17
        with:
          server_address: smtp.gmail.com
          server_port: 465
          secure: true
          username: ${{ secrets.MAIL_USERNAME }}
          password: ${{ secrets.MAIL_PASSWORD }}
          from: News Radar <${{ secrets.MAIL_USERNAME }}>
          to: ${{ secrets.MAIL_TO }}
          subject: ${{ steps.render.outputs.subject }}
          html_body: file://digest.html
          convert_markdown: false

      # seen-history must persist or every run re-mails the same items. The Mac
      # writes reach-raw.json and this job writes the render state, so rebase
      # rather than assume this runner is the only writer.
      - name: Commit render state
        run: |
          git config user.name "news-radar-bot"
          git config user.email "bot@users.noreply.github.com"
          git add data/seen-history.json data/digest-state.json data/items.json data/index.html
          git diff --cached --quiet && echo "no changes" && exit 0
          git commit -m "news-radar: render $(date -u +%FT%TZ)"
          git pull --rebase --autostash origin ${{ github.ref_name }}
          git push

      # Only the dashboard is published. data/ also holds the raw collection and the
      # state files: already public in the repo, but there is no reason to serve them
      # from the site as well.
      - name: Stage the site
        run: mkdir -p _site && cp data/index.html _site/index.html

      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    needs: deliver
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # Pages intermittently answers "Deployment failed, try again later"; the first
      # attempt tolerates it so a transient failure does not fail the run.
      - id: deployment
        uses: actions/deploy-pages@v5
        continue-on-error: true
      - name: Retry deploy on transient failure
        if: steps.deployment.outcome == 'failure'
        uses: actions/deploy-pages@v5
