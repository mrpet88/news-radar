# News Radar — collects the network-only channels, renders and delivers.
#
# exa, github and rss are collected here every morning, so the email does not
# depend on the Mac. Channels that need the Mac's Chrome session (reddit) are
# collected by scripts/run-local.sh and pushed as data/reach-mac.json; the render
# merges it in while it is fresh and reports it as stale otherwise.
#
# Delivery needs three repo secrets, all set:
#   MAIL_USERNAME  — the Gmail address
#   MAIL_PASSWORD  — a Gmail *app password*, stripped of the non-breaking spaces
#                    Google's UI puts between the four groups (16 chars, not 19)
#   MAIL_TO        — where the digest goes
# The mail step needs both USERNAME and PASSWORD present or it skips, so running
# this workflow is safe even if a secret is later removed.
#
# Actions are pinned to Node 24-era majors; anything still on Node 20 emits a
# deprecation warning on every run and will eventually stop working.

name: news-radar

on:
  workflow_dispatch:
    inputs:
      force_digest:
        description: "Render a digest even if nothing is new (tests the mail path)"
        type: boolean
        default: false
  # One run a day, one email a day. No push trigger: the Mac's push would otherwise
  # mean a second run and a second email. Its reddit items join the next morning's.
  # GitHub starts scheduled runs late (06:30 has landed around 12:00 UTC); :37 is
  # off the top-of-hour rush, and anything after the Mac's 06:45-local slot works.
  schedule:
    - cron: "37 6 * * *"

permissions:
  contents: write
  pages: write
  id-token: write

# Serialise Pages deployments so concurrent runs cannot collide.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deliver:
    runs-on: ubuntu-latest
    # Secrets are not readable from a step's `if:`, so they are lifted to job env
    # to be testable there. Both must be present: with a username but no app
    # password the mail step would attempt SMTP and fail the run, where skipping
    # is the correct behaviour until delivery is fully configured.
    env:
      MAIL_USERNAME: ${{ secrets.MAIL_USERNAME }}
      MAIL_PASSWORD: ${{ secrets.MAIL_PASSWORD }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version: "22" }
      - run: npm ci || npm install
      - run: npm run build

      # If SMTP ever returns 535 BadCredentials again, the cause is almost always
      # the stored password carrying Google's display separators — which are
      # non-breaking spaces, so [[:space:]] will not find them. Compare
      # ${#MAIL_PASSWORD} against the alphanumeric-only count (should both be 16):
      #   printf '%s' "$MAIL_PASSWORD" | LC_ALL=C tr -cd 'a-zA-Z0-9' | wc -c

      # Exa's hosted MCP endpoint needs no key; mcporter is the same client the Mac
      # uses, pinned so a release cannot change the output format under the parser.
      - name: Set up exa client
        run: |
          npm install -g mcporter@0.13.0
          mkdir -p ~/.mcporter
          echo '{"mcpServers":{"exa":{"baseUrl":"https://mcp.exa.ai/mcp"}}}' > ~/.mcporter/mcporter.json

      # Best-effort like every collector: a failure leaves the previous
      # reach-cloud.json in place to age, and the freshness gate and the BROKEN
      # heartbeat take it from there. It must not stop the render or the email.
      - name: Collect (exa, github, rss)
        env:
          REACH_SIDE: cloud
          GH_TOKEN: ${{ github.token }}
        run: node scripts/reach-collect.mjs || echo "::warning::cloud collection produced nothing (exit $?)"

      - name: Render digest and dashboard
        id: render
        env:
          NEWS_RADAR_DIGEST_FORCE: ${{ inputs.force_digest }}
          NEWS_RADAR_DASHBOARD_URL: ${{ vars.NEWS_RADAR_DASHBOARD_URL }}
        run: npm start

      # Fires for both a digest and the 3-day heartbeat — the subject says which.
      - name: Email digest
        if: steps.render.outputs.send == 'true' && env.MAIL_USERNAME != '' && env.MAIL_PASSWORD != ''
        # v17, not v3: v3 runs on Node 20, which GitHub has deprecated. Every input
        # used here carries the same name in v17, so the bump is a drop-in.
        uses: dawidd6/action-send-mail@v17
        with:
          server_address: smtp.gmail.com
          server_port: 465
          secure: true
          username: ${{ secrets.MAIL_USERNAME }}
          password: ${{ secrets.MAIL_PASSWORD }}
          from: News Radar <${{ secrets.MAIL_USERNAME }}>
          to: ${{ secrets.MAIL_TO }}
          subject: ${{ steps.render.outputs.subject }}
          html_body: file://digest.html
          convert_markdown: false

      # seen-history must persist or every run re-mails the same items. The Mac
      # writes reach-mac.json and this job writes everything else, so the rebase
      # never has two sides of one file to reconcile.
      - name: Commit render state
        run: |
          git config user.name "news-radar-bot"
          git config user.email "bot@users.noreply.github.com"
          git add data/reach-cloud.json data/seen-history.json data/digest-state.json data/items.json data/index.html
          git diff --cached --quiet && echo "no changes" && exit 0
          git commit -m "news-radar: render $(date -u +%FT%TZ)"
          git pull --rebase --autostash origin ${{ github.ref_name }}
          git push

      # Only the dashboard is published. data/ also holds the raw collection and the
      # state files: already public in the repo, but there is no reason to serve them
      # from the site as well.
      - name: Stage the site
        run: mkdir -p _site && cp data/index.html _site/index.html

      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    needs: deliver
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # Pages intermittently answers "Deployment failed, try again later"; the first
      # attempt tolerates it so a transient failure does not fail the run.
      - id: deployment
        uses: actions/deploy-pages@v5
        continue-on-error: true
      - name: Retry deploy on transient failure
        if: steps.deployment.outcome == 'failure'
        uses: actions/deploy-pages@v5
